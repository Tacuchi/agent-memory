name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "ARCHITECTURE.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "ARCHITECTURE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Las pruebas de búsqueda usan el modelo de embeddings real y corren sin red: se trae una vez por
      # id de modelo y queda en caché entre corridas.
      - name: id del modelo fijado
        id: modelo
        run: |
          npx tsc -p tsconfig.build.json
          echo "id=$(node -e 'import("./dist/search/models.js").then((m) => { const x = m.modeloFijado(); console.log(`${x.id}-${x.dtype}`.replace(/[^A-Za-z0-9._-]/g, "_")); })')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/agent-memory/models
          key: modelo-${{ runner.os }}-${{ steps.modelo.outputs.id }}
      - run: npm run model:fetch
      # Los kernels cuantizados de ONNX cambian según la CPU: queda anotado en cada corrida para comparar fallas.
      - name: CPU del runner
        run: |
          node -p '`${process.platform} ${process.arch} · ${require("node:os").cpus()[0]?.model}`'
          if [ -r /proc/cpuinfo ]; then
            flags=" $(grep -m1 '^flags' /proc/cpuinfo) "
            for f in avx2 avx512f avx512_vnni avx_vnni; do case "$flags" in *" $f "*) echo "$f: sí";; *) echo "$f: no";; esac; done
          elif [ "$RUNNER_OS" = "macOS" ]; then
            sysctl hw.optional.arm.FEAT_DotProd hw.optional.arm.FEAT_I8MM 2>/dev/null || true
          else
            echo "flags de VNNI: no disponibles en $RUNNER_OS"
          fi
      - run: npm test
      - name: package smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/pack" "$RUNNER_TEMP/global"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          npm install -g --prefix "$RUNNER_TEMP/global" "$RUNNER_TEMP"/pack/tacuchi-agent-memory-*.tgz
          # En Windows, el PATH de bash va en forma /d/…: los dos puntos de «D:» lo partirían en dos.
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$(cygpath -u "$RUNNER_TEMP")/global"; else bin="$RUNNER_TEMP/global/bin"; fi
          export PATH="$bin:$PATH"
          agent-memory --version
          export AGENT_MEMORY_HOME="$RUNNER_TEMP/am-home"
          agent-memory doctor | tee "$RUNNER_TEMP/doctor.txt" || true
          grep -E "^ok +sqlite-vec:" "$RUNNER_TEMP/doctor.txt"
