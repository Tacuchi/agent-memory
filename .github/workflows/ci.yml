name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Las pruebas de búsqueda usan el modelo de embeddings real y corren sin red: se trae una vez por
      # id de modelo y queda en caché entre corridas.
      - name: id del modelo fijado
        id: modelo
        run: |
          npx tsc -p tsconfig.build.json
          echo "id=$(node -e 'import("./dist/search/models.js").then((m) => { const x = m.modeloFijado(); console.log(`${x.id}-${x.dtype}`.replace(/[^A-Za-z0-9._-]/g, "_")); })')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/agent-memory/models
          key: modelo-${{ runner.os }}-${{ steps.modelo.outputs.id }}
      - run: npm run model:fetch
      # TEMPORAL: diagnóstico de la búsqueda por vector en cada sistema.
      - name: diagnóstico temporal de embeddings
        continue-on-error: true
        run: node --disable-warning=ExperimentalWarning .github/diagnostico-embeddings.mjs
      # TEMPORAL: diagnóstico de PowerShell con un entorno mínimo, para el stop colgado en Windows.
      - name: diagnóstico temporal de PowerShell
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/diag.mjs" <<'EOF'
          import { execFileSync } from "node:child_process";
          const ps = `${process.env.SystemRoot}\\System32\\WindowsPowerShell\\v1.0\\powershell.exe`;
          const q = `(Get-CimInstance Win32_Process -Filter 'ProcessId=${process.pid}').CommandLine`;
          const base = { SystemRoot: process.env.SystemRoot, ComSpec: process.env.ComSpec, PATHEXT: process.env.PATHEXT, TEMP: process.env.TEMP, TMP: process.env.TMP, PATH: `${process.env.SystemRoot}\\System32` };
          const extra = { windir: process.env.windir, LOCALAPPDATA: process.env.LOCALAPPDATA, APPDATA: process.env.APPDATA, PSModulePath: process.env.PSModulePath };
          const casos = { completo: process.env, minimo: base, minimoConHome: { ...base, USERPROFILE: process.env.RUNNER_TEMP }, conExtra: { ...base, ...extra }, conExtraYHome: { ...base, ...extra, USERPROFILE: process.env.RUNNER_TEMP } };
          for (const [n, env] of Object.entries(casos)) {
            const t = Date.now();
            try {
              const out = execFileSync(ps, ["-NoProfile", "-NonInteractive", "-Command", q], { env, encoding: "utf8", stdio: ["ignore", "pipe", "pipe"], timeout: 60000 });
              console.log(n, Date.now() - t, "ms", JSON.stringify(out.trim().slice(0, 100)));
            } catch (e) {
              console.log(n, Date.now() - t, "ms ERROR", e.code, e.signal, String(e.stderr).slice(0, 400));
            }
          }
          EOF
          node "$RUNNER_TEMP/diag.mjs"
      - run: npm test
      - name: package smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/pack" "$RUNNER_TEMP/global"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          npm install -g --prefix "$RUNNER_TEMP/global" "$RUNNER_TEMP"/pack/tacuchi-agent-memory-*.tgz
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$RUNNER_TEMP/global"; else bin="$RUNNER_TEMP/global/bin"; fi
          export PATH="$bin:$PATH"
          agent-memory --version
          export AGENT_MEMORY_HOME="$RUNNER_TEMP/am-home"
          agent-memory doctor | tee "$RUNNER_TEMP/doctor.txt" || true
          grep -E "^ok +sqlite-vec:" "$RUNNER_TEMP/doctor.txt"
