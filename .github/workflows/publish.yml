name: publish

on:
  release:
    types: [published]
  # Para relanzar una publicación que falló sin crear otro release.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or newer; no token is stored.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      # prepublishOnly corre las pruebas de búsqueda, que usan el modelo de embeddings real sin red.
      - run: npm run model:fetch
      # npm publish runs prepublishOnly (typecheck + tests) and prepack (clean build).
      # With trusted publishing, npm adds provenance automatically.
      - run: npm publish

  # La imagen del relé, con la misma versión que el paquete recién publicado. Corre solo después de publicar el
  # paquete, es decir, cuando la persona publica un release (o relanza a mano esta publicación).
  relay-image:
    needs: publish
    # El job de npm puede fallar por OIDC (E404) cuando se publica a mano desde la máquina: la imagen se construye
    # igual, porque el paso siguiente espera a que npm sirva la versión.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: versión e imagen
        id: datos
        run: |
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
          echo "imagen=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/agent-memory-relay" >> "$GITHUB_OUTPUT"
      # npm puede tardar unos minutos en servir una versión recién publicada: el Dockerfile la instala desde ahí.
      # `npm view` ya ve la versión cuando el tarball todavía da 404, así que se espera al tarball mismo.
      - name: esperar a que npm sirva el tarball
        run: |
          tarball="https://registry.npmjs.org/@tacuchi/agent-memory/-/agent-memory-${{ steps.datos.outputs.version }}.tgz"
          for intento in $(seq 1 60); do
            if curl -sfI "$tarball" >/dev/null; then exit 0; fi
            sleep 10
          done
          echo "npm no sirve $tarball después de 10 minutos" >&2
          exit 1
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: deploy/relay
          platforms: linux/amd64,linux/arm64
          build-args: AGENT_MEMORY_VERSION=${{ steps.datos.outputs.version }}
          push: true
          tags: |
            ${{ steps.datos.outputs.imagen }}:${{ steps.datos.outputs.version }}
            ${{ steps.datos.outputs.imagen }}:latest
