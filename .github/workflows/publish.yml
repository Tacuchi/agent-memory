name: publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or newer; no token is stored.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      # npm publish runs prepublishOnly (typecheck + tests) and prepack (clean build).
      # With trusted publishing, npm adds provenance automatically.
      - run: npm publish
