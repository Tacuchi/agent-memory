# Relay on Fly.io from the published image. Steps: deploy/relay/README.md («Fly.io»).
# Change `app` to a name of your own; the key goes in a Fly secret, never in this file.
app = "agent-memory-relay-change-me"

[build]
  image = "ghcr.io/tacuchi/agent-memory-relay:latest"

[env]
  # Fly Proxy sets Fly-Client-IP to the client's address: the relay counts failed key attempts by it.
  AGENT_MEMORY_RELAY_IP_HEADER = "fly-client-ip"

[http_service]
  internal_port = 8787
  force_https = true
  # Both PCs keep a WebSocket open to the relay: a stopped machine would drop them.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
