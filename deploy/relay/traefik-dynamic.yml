# Traefik file-provider route for the relay on Coolify, behind Cloudflare (proxied DNS record).
# Copy it to the proxy's dynamic directory (/data/coolify/proxy/dynamic/ on Coolify); Traefik reloads it on save.
# The Coolify app keeps NO domain, so this router is the only way in. Replace <container> with the app's container
# name (Coolify: the app uuid, with "consistent container name" enabled) and relay.example.com with your host.
#
# Why both middlewares: the server IP is public, so a rate limit keyed on the client IP is only trustworthy if
# requests cannot skip Cloudflare. The allowlist checks the TCP peer (Cloudflare, as long as Traefik does not trust
# forwarded headers); then CF-Connecting-IP is set by Cloudflare and cannot be spoofed.
http:
  middlewares:
    # Ranges from https://www.cloudflare.com/ips-v4 and /ips-v6 (checked 2026-11-10); update them when Cloudflare does.
    relay-cloudflare:
      ipAllowList:
        sourceRange:
          - 173.245.48.0/20
          - 103.21.244.0/22
          - 103.22.200.0/22
          - 103.31.4.0/22
          - 141.101.64.0/18
          - 108.162.192.0/18
          - 190.93.240.0/20
          - 188.114.96.0/20
          - 197.234.240.0/22
          - 198.41.128.0/17
          - 162.158.0.0/15
          - 104.16.0.0/13
          - 104.24.0.0/14
          - 172.64.0.0/13
          - 131.0.72.0/22
          - 2400:cb00::/32
          - 2606:4700::/32
          - 2803:f800::/32
          - 2405:b500::/32
          - 2405:8100::/32
          - 2a06:98c0::/29
          - 2c0f:f248::/32
    # 30 requests per minute per real client IP, burst 10. The owner reconnects about once a minute per mailbox
    # (plus a growing backoff after an error), far below it; a key-guessing burst gets 429.
    relay-limit:
      rateLimit:
        average: 30
        period: 1m
        burst: 10
        sourceCriterion:
          requestHeaderName: CF-Connecting-IP
    relay-redirect-https:
      redirectScheme:
        scheme: https
  routers:
    relay-http:
      entryPoints: [http]
      rule: Host(`relay.example.com`)
      middlewares: [relay-cloudflare, relay-redirect-https]
      service: relay
    relay-https:
      entryPoints: [https]
      rule: Host(`relay.example.com`)
      middlewares: [relay-cloudflare, relay-limit]
      service: relay
      tls:
        certResolver: letsencrypt
  services:
    relay:
      loadBalancer:
        servers:
          - url: http://<container>:8787
